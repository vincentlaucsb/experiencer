name: Tests & Coverage

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type check
      run: npx tsc --noEmit

    - name: Enforce shared application spacing
      run: npm run spacing:check && npm run spacing:test

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Install Chromium for editor regressions
      if: matrix.node-version == '22.x'
      run: npx playwright install --with-deps chromium

    - name: Verify editor usability and print browser boundaries
      if: matrix.node-version == '22.x'
      run: npx playwright test e2e/editor-usability.spec.ts e2e/editor.spec.ts e2e/css-inspector.spec.ts e2e/editor-control-accessibility.spec.ts e2e/ui-document-accessibility.spec.ts --workers=2

    - name: Upload coverage to Codecov
      # Downloading the uploader can throw before fail_ci_if_error applies.
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.node-version }}
        path: coverage/
        retention-days: 30
